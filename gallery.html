<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | The Baby Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursorFollower"></div>

    <nav class="nav" id="nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo/ThebabyStudio-logo (1).png" alt="The Baby Studio Logo" class="logo-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="logo-icon fallback">B</div>
                <div class="logo-text">
                    <span class="logo-main">The Baby Studio</span>
                    <span class="logo-sub">Photography & Film</span>
                </div>
            </a>

            <div class="nav-menu" id="navMenu">
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#services" class="nav-link">Services</a>
                <a href="index.html#portfolio" class="nav-link">Portfolio</a>
                <a href="gallery.html" class="nav-link">Gallery</a>
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>

            <a href="index.html#contact" class="nav-cta">Book a Session</a>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="gallery-page">
        <section class="gallery-page-content">
            <div class="section-header center">
                <span class="section-eyebrow">Gallery</span>
                <h1 class="section-title">Our full session gallery</h1>
                <p class="section-subtitle">Browse all studio images in one place. For category-specific portfolios, use the homepage portfolio cards.</p>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <p class="gallery-empty" id="galleryEmpty" hidden>No photos published yet. Check back soon.</p>
            </div>

            <div class="portfolio-cta">
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        const escapeHtml = (value = '') => {
            const el = document.createElement('span');
            el.textContent = value;
            return el.innerHTML;
        };
        fetch('/api/photos').then(r => r.json()).then(photos => {
            const grid = document.getElementById('galleryGrid');
            const empty = document.getElementById('galleryEmpty');
            if (!photos.length) { empty.hidden = false; return; }
            grid.insertAdjacentHTML('beforeend', photos.map(photo => `
                <div class="gallery-item"><img src="${escapeHtml(photo.imageUrl)}" alt="${escapeHtml(photo.alt || photo.title || 'Studio photo')}" loading="lazy"></div>
            `).join(''));
        }).catch(() => {
            document.getElementById('galleryEmpty').hidden = false;
        });
    </script>
</body>
</html>
